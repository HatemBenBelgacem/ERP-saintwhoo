[package]
name = "uniqwork"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
# ANF-025: Datei hochladen (Logo) über Server-Funktionen mit MultipartFormData
server_fn = { version = "0.8", features = ["multipart"] }
# ANF-027: Flächen und Lage im Geländeplan (Server und Browser)
geo = { version = "0.33", default-features = false }

# nur Server (ssr)
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"], optional = true }
dotenvy = { version = "0.15", optional = true }
argon2 = { version = "0.5", features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }

# nur Browser (hydrate)
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# ANF-027: Daten an die Kartenbrücke (map_bridge.js) übergeben
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
# Modultests: prüfen, was an den Browser gesendet wird (ANF-026)
serde_json = "1"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:serde-wasm-bindgen",
    "dep:js-sys",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:dotenvy",
    "dep:argon2",
    "dep:sha2",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "uniqwork"
site-root = "target/site"
site-pkg-dir = "pkg"
# wird von `npm run css:build` / `css:watch` erzeugt (Tailwind + daisyUI)
style-file = "styles/output.css"
assets-dir = "public"
site-addr = "127.0.0.1:3002"
reload-port = 3003
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
